{% extends 'base.html' %}

{% block content %}
<<h1>Добавить или Редактировать продукт</h1>
<form method="post">
    {% csrf_token %}
    {{ form.non_field_errors }} <!-- Ошибки, которые не связаны с конкретными полями формы -->
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Сохранить</button>
     <a href="{% url 'catalog:product_list' %}" class="btn btn-outline-primary">Назад</a>
</form>
{% endblock %}
